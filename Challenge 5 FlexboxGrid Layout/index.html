<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NazikDev - Challenge 05 (Flexbox & Grid Layout)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Header Navbar -->
    <header class="navbar">
        <div class="logo-container">
            <div class="logo-badge">
                <span class="logo-icon">N</span>
            </div>
            <div class="logo-text">
                <span class="logo">NazikDev</span>
            </div>
        </div>

        <nav>
            <ul class="nav-links">
                <li><a href="#home">HOME</a></li>
                <li><a href="#about">ABOUT US</a></li>
                <li><a href="#purchase">PURCHASE</a></li>
                <li><a href="#featured">FEATURED</a></li>
                <li><a href="#contact" class="active">CONTACT US</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Section with Invite Users Modal / Box -->
    <main class="invite-section">
        <!-- Step Indicators -->
        <div class="step-indicators">
            <span class="step-dot active"></span>
            <span class="step-dot"></span>
            <span class="step-dot"></span>
        </div>

        <!-- Invite Box Card -->
        <div class="invite-card fade-in">
            <h1 class="invite-title">INVITE USERS</h1>

            <form class="invite-form" action="#" method="post" onsubmit="return false;">
                <div class="invite-input-group">
                    <input type="email" placeholder="colleague@example.com" required>
                    <button type="button" class="remove-field-btn"><i class="fas fa-times"></i></button>
                </div>

                <div class="invite-input-group">
                    <input type="email" placeholder="teammate@example.com" required>
                    <button type="button" class="remove-field-btn"><i class="fas fa-times"></i></button>
                </div>

                <div class="invite-input-group">
                    <input type="email" placeholder="developer@example.com" required>
                    <button type="button" class="remove-field-btn"><i class="fas fa-times"></i></button>
                </div>

                <!-- Form Actions -->
                <div class="invite-actions">
                    <button type="submit" class="btn send-invites-btn">SEND INVITES!</button>
                    <a href="#" class="skip-step">SKIP THIS STEP</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer Bar -->
    <footer class="footerbar">
        <p>COPYRIGHT 2026. ALL RIGHTS RESERVED NAZIKDEV</p>
    </footer>

</body>
</html>
