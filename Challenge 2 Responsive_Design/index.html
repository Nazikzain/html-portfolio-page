<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NazikDev - Challenge 02 (Responsive Design)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Responsive Top Navigation Bar -->
    <header class="navbar">
        <div class="logo-container">
            <div class="logo-badge">
                <span class="logo-icon">N</span>
            </div>
            <div class="logo-text">
                <span class="logo">NazikDev</span>
                <span class="tagline">TAGLINE</span>
            </div>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="#about">ABOUT</a></li>
                <li><a href="#skills">SKILLS</a></li>
                <li><a href="#projects">PROJECTS</a></li>
                <li><a href="#contact">CONTACT</a></li>
            </ul>
        </nav>
        <div class="social-icons">
            <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        </div>
    </header>

    <!-- Responsive Hero Section -->
    <section class="hero-section">
        <div class="hero-container">
            <!-- Left Content Box -->
            <div class="hero-text-box">
                <h1 class="header-text">HEADER TEXT</h1>
                <div class="paragraph-box">
                    <p class="paragraph-text">
                        PARAGRAPH TEXT<br>
                        Welcome to NazikDev portfolio. Crafting immersive digital experiences with cutting-edge technologies and responsive layouts.
                    </p>
                    <button class="btn read-more-btn">READ MORE</button>
                </div>
                <div class="action-buttons">
                    <button class="btn sub-btn">PORTFOLIO</button>
                    <button class="btn sub-btn">SERVICES</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Responsive Footer Bar -->
    <footer class="footerbar">
        <nav>
            <ul class="footer-links">
                <li><a href="#about">ABOUT</a></li>
                <li><a href="#skills">SKILLS</a></li>
                <li><a href="#projects">PROJECTS</a></li>
                <li><a href="#contact">CONTACT</a></li>
            </ul>
        </nav>
        <div class="social-icons">
            <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        </div>
    </footer>

</body>
</html>
